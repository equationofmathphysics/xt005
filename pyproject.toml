[project]
name = "xt005"
version = "3.0.0"
description = "PTY workspace terminal and file management service"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=23.0,<24",
  "Flask-SocketIO>=5.3,<6",
  "simple-websocket>=1.1,<2",
  "pyte>=0.8.2,<0.9",
  "regex>=2024.0,<2027",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=5.4.1,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
